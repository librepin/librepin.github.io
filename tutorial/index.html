LibrePin és una aplicació web progressiva (PWA) per a la gestió de punts d'interès personalitzats en un mapa interactiu. Està dissenyada per ser lleugera, ràpida i funcional tant en dispositius mòbils com en escriptori; però encara més important, està dissenyada per a ser completament vostra.

## Què és LibrePin?

LibrePin et permet:

- **Crear pins** personalitzats amb nom, descripció, imatge, etiquetes i valoració.
- **Organitzar els teus llocs** en grups temàtics.
- **Cercar al teu voltant o allò que t'interessa** amb un accés ràpid.
- **Moure't per la ciutat** traçant rutes o amb l'ajuda del transport públic.
- **Recordar allà on has estat** segons diferents modes (entorn, fora d'entorn, només favorits, transport).

## Per què LibrePin i no altres?

Perquè **LibrePin us pertany**. És una eina pensada per a vosaltres, per a la vostra manera de veure el món, feta per a qui vol construir el seu propi mapa sense imposicions ni contingut predeterminat. No hi ha res preestablert. Vosaltres decidiu què hi poseu, com ho organitzeu i cap a on voleu que creixi.

No venim amb un catàleg de llocs ni us omplim la pantalla amb dades que no heu demanat. Som un espai en blanc, un llenç on cada pin, cada ruta i cada etiqueta és una decisió vostra, no un suggeriment d'un algoritme. Això vol dir que el mapa que creeu serà realment vostre: reflectirà les vostres vivències, els vostres records i la vostra manera d'entendre l'espai.

Quan arrenqueu LibrePin per primera vegada, no hi ha res. Ni un sol pin, ni una ruta marcada, ni cap punt d'interès. El vostre mapa, les vostres regles. I aquest buit inicial no és un defecte: és la garantia que allò que construireu serà autèntic, personal i sense interferències externes. Sou vosaltres qui, a poc a poc, anireu donant forma al vostre propi mapa, sense distraccions, sense publicitat, sense marques que us diguin on anar.

LibrePin és per a qui vol fer-ho tot pel seu compte. Per a qui prefereix un mapa fet a mà, a mida i que només contingui allò que realment li importa. Si us ve de gust crear, organitzar i decidir, aquesta és la vostra eina. La resta, us la deixem a vosaltres.

# Instal·lació i Configuració Inicial

## Com instal·lar LibrePin

LibrePin és una aplicació web que no requereix cap procés d'instal·lació tradicional. Podeu accedir-hi directament des del vostre navegador, com a qualsevol altra pàgina web. No cal baixar apps de cap botiga ni concedir permisos especials.

Tot i això, **recomanem instal·lar-la com a PWA** (aplicació web progressiva). Això vol dir que la web s'instal·larà al vostre dispositiu com si fos una aplicació nativa: apareixerà a la pantalla d'inici del vostre telèfon, tauleta o ordinador, amb la seva pròpia icona, i s'obrirà a pantalla completa, sense les barres del navegador, oferint-vos una experiència més immersiva i ràpida.

### Com instal·lar-la com a PWA

La majoria de navegadors moderns inclouen una opció per instal·lar pàgines web com a aplicacions. El procediment és senzill i només us portarà uns segons:

1. **Obriu LibrePin** al vostre navegador preferit (Chrome, Edge, Safari, Firefox, etc.).
2. **Localitzeu l'opció d'instal·lació** al menú del navegador:
   - A **Chrome** (Android/ordinador): toqueu els tres punts verticals ⋮ a la part superior dreta i seleccioneu **"Instal·la l'aplicació"** o **"Crea una drecera"**.
   - A **Safari** (iPhone/iPad): toqueu la icona de compartir (quadrat amb fletxa) i seleccioneu **"Afegeix a la pantalla d'inici"**.
   - A **Firefox** (Android): toqueu els tres punts ⋮ i seleccioneu **"Afegeix a la pantalla d'inici"**.
3. **Confirmeu la instal·lació** i, si el navegador us ho permet, podeu canviar el nom de la drecera abans de desar-la.
4. A partir d'aquest moment, trobareu la icona de **LibrePin** a la pantalla d'inici del vostre dispositiu, juntament amb la resta d'aplicacions.

### Avantatges d'instal·lar-la com a PWA

- **Accés ràpid**: la icona roman sempre a la pantalla d'inici, com qualsevol altra app.
- **Pantalla completa**: s'executa sense les barres del navegador, aprofitant al màxim l'espai.
- **Funciona sense connexió** (parcialment): un cop carregada, podeu consultar el mapa i els pins que ja heu visitat, fins i tot sense Internet (tot i que el mapa necessita connexió per carregar les imatges).
- **Actualitzacions automàtiques**: sempre tindreu l'última versió, sense necessitat de baixar res manualment.

### Instal·lació tradicional (sense PWA)

Si preferiu no instal·lar-la com a PWA, simplement afegiu l'enllaç a les adreces d'interès del vostre navegador o obriu-la directament des de la barra d'adreces cada cop que vulgueu utilitzar-la. No cal cap altre pas.

> **Nota**: La instal·lació com a PWA és completament opcional i no afecta el funcionament de l'aplicació. Podeu utilitzar LibrePin indistintament des del navegador o des de la drecera instal·lada, ja que les dades es comparteixen entre ambdues.

# Gestió de Pins

## Què és un pin?

Un pin és un punt d'interès que pots afegir al mapa. Cada pin pot contenir:

| Camp | Descripció | Obligatori |
|------|------------|------------|
| **Nom** | Títol del pin. | ✅ Sí |
| **Subtítol** | Breu descripció addicional (màx 100 caràcters). | ❌ No |
| **Descripció** | Text llarg amb informació detallada. | ❌ No |
| **Etiquetes** | Paraules clau separades per comes. | ❌ No |
| **Imatge** | URL d'una imatge per al pin. (No es permet pujar un fitxer, parlem d'això més endavant.) | ❌ No |
| **Coordenades** | Latitud i longitud (s'obtenen automàticament si es crea des del mapa, no ho ompliu a mà si no s'escau). | ✅ Sí |
| **Valoració** | De 1 a 5 estrelles. | ❌ No |
| **Ressenya** | Títol (màx 50 caràcters) i text lliure. | ❌ No |
| **Botons personalitzats** | Enllaços amb text personalitzat. | ❌ No |
| **Parada de transport** | Marca el pin com a parada de transport públic. | ❌ No |
| **Serveis** | Servei de transport que hi circula. | ❌ No |
| **Enllaços d'horari** | URL per consultar horaris. | ❌ No |
| **MP3** | URL d'un àudio per reproduir. (Només si és una parada) | ❌ No |
| **Pins relacionats** | Altres pins vinculats. | ❌ No |
| **Fora de l'entorn** | Marca el pin com a fora de l'entorn per defecte. | ❌ No |

### Obtenció d'URLs d'imatges
Dirigiu-vos a la secció dedicada a això des de la barra lateral d'aquest lloc web.


## Crear un pin

### Des del mapa
1. Feu clic en qualsevol punt del mapa.
2. Apareixerà un botó "Afegir" a la part inferior.
3. Feu clic per obrir el diàleg de creació.
4. Ompliu els camps i deseu.

## Editar un pin

1. Obre en detall el pin.
2. Fes clic a la icona ✏️ (editar) a la barra superior.
3. Modifica els camps que vulguis.

## Eliminar un pin

1. Obre el detall del pin.
2. Fes clic a la icona 🗑️ (eliminar) a la barra superior.
3. Confirma l'eliminació.

## Duplicat de pins

L'aplicació comprova que no hi hagi dos pins amb el mateix nom i coordenades. Si intenteu crear-ne un de duplicat, rebreu un avís.

# Gestió de Grups

## Què és un grup?

Un grup és una col·lecció temàtica de pins. Et permet organitzar els teus pins per categories (ex: "Restaurants", "Museus", "Transport", etc.). També pot servir pet categoritzar x marca de supermercats o agrupar tots els pins d'un centre comercial.

## Crear un grup

1. Ves a la pestanya **Grups** (📚) a la barra inferior.
2. Fes clic al botó **"Crear grup"**.
3. Omple les dades del grup:
   - **Nom** (obligatori).
   - **Color d'accent** (per identificar el grup).
   - **URL de la icona** (opcional).
   - **Descripció** (opcional).
   - **Pins que en formen part**: Selecciona els pins que pertanyen al grup.
4. Fes clic a **Guardar**.

## Gestionar grups

- **Veure grups**: A la pestanya Grups veuràs tots els grups creats.
- **Cercar grups**: Utilitza el camp de cerca per filtrar per nom.
- **Accedir a un grup**: Fes clic a una targeta de grup per obrir-ne el detall.

## Detall d'un grup

Quan obres un grup, pots:

- **Veure els pins** que en formen part.
- **Ordenar els pins** del grup (per recent, valoració, alfabètic o distància).
- **Editar el grup**: Modificar nom, color, icona, descripció o pins associats.
- **Eliminar el grup**: Confirma l'eliminació.

## Ordenar pins d'un grup

Fes clic a la icona d'ordenació (⇅) al detall del grup per alternar entre:

| Mode | Descripció |
|------|------------|
| **Recent** | Per data d'última visita. |
| **Valoració** | De més alta a més baixa. |
| **Alfabètic** | Per nom de la A a la Z. |
| **Distància** | Més a prop de la teva ubicació (requereix GPS). |

## Vegeu també

Si un pin pertany a un o més grups, al detall del pin apareixerà el botó **"Vegeu també"**. Fent-hi clic es mostra un pop-up amb els grups als quals pertany, i pots accedir-hi directament.

# Cerca i Preferits

## Cerca de pins

La funcionalitat de cerca permet trobar pins de manera ràpida i eficient.

### Com cercar

1. Aneu a la pestanya **Buscar** (🔍) a la barra inferior.
2. Teclegeu almenys 2 caràcters al camp de cerca.
3. Els resultats es mostraran automàticament.

### Què es busca

La cerca es realitza sobre:
- **Nom** del pin.
- **Subtítol** del pin.
- **Etiquetes** (tags) assignades.

### Ordenar resultats

Un cop feta una cerca, podeu ordenar els resultats fent clic a la icona d'ordenació. Els modes disponibles són:

| Mode | Descripció |
|------|------------|
| **Últim vist** | Per data d'última visita. |
| **Puntuació** | De més alta a més baixa. |
| **Alfabètic** | Per nom de la A a la Z. |
| **Més a prop** | Per distància a la teva ubicació (requereix GPS). |

> **Nota**: El mode d'ordenació s'aplica també a la llista de preferits.

### Carregar més resultats

Si hi ha més de 25 resultats, apareixerà un botó "Carregar més" al final de la llista.

## Preferits

Els preferits et permeten marcar pins per a un accés ràpid.

### Afegir un pin a preferits

1. Obriu el detall del pin.
2. Feu clic a la icona ❤️ (cor) a la barra superior.
3. El cor es tornarà groc i el pin s'afegirà a la llista de preferits.

### Veure els preferits

1. Aneu a la pestanya **Preferits** (❤️) a la barra inferior.
2. Veureu la llista de tots els pins marcats com a preferits.
3. Podeu ordenar la llista fent clic al botó **"Ordenar"**.

### Indicador de preferit

Els pins que són preferits mostren un cor groc a la cantonada superior dreta a les vistes de:
- Cerca.
- Grups.
- Llista de preferits.

# Modes de Visualització

LibrePin disposa de quatre modes de visualització que permeten filtrar els pins mostrats al mapa i a les llistes.

## Accés als modes

Podeu canviar de mode de dues maneres:
1. **Barra lateral**: Opció "Mode de visualització".
2. **Barra de cerca**: Des de la cerca, fent clic a la icona 👁️.

## Modes disponibles

### 1. El meu entorn (🏠)

- **Descripció**: Mostra només els pins del teu entorn.
- **Com funciona**: Filtra els pins que tenen la marca "Fora del meu entorn" desactivada.
- **Indicador**: Punt verd a la icona de perfil.

### 2. Fora del meu entorn (🌴)

- **Descripció**: Mostra tots els pins, inclosos els de fora del teu entorn.
- **Com funciona**: No aplica cap filtre d'entorn.
- **Indicador**: Punt taronja a la icona de perfil.

### 3. No destorbar (🌙)

- **Descripció**: Mostra només els pins marcats com a preferits.
- **Com funciona**: Filtra els pins que no són preferits.

### 4. Només transport (🚌)

- **Descripció**: Mostra només les parades de transport públic.

- **Indicador**: Punt blau a la icona de perfil.

## Efectes del mode en altres funcions

- **Cerca**: Només es mostren resultats dels pins visibles en el mode actual.
- **Grups**: Només es mostren pins visibles dins dels grups.

# Llegendes i Línies

## Què són les línies?

Les línies et permeten dibuixar rutes o traçats al mapa. Són útils per a:
- Marcar un itinerari.
- Indicar una ruta de transport com ara el metro o trens de rodalia.
- Dibuixar un poligon per marcar una zona.

## Crear una línia

1. Aneu a **Arranjament** → **Línies**
2. Feu clic a **"Afegir línia"**.
3. Ompliu les dades:
   - **Nom** (obligatori).
   - **URL de la icona (PNG)** (opcional).
   - **Color** (selector de color).
   - **Gruix (px)**: Entre 2 i 12 píxels.
   - **Punts**: Llista de coordenades separades per \`;\` (ex: \`41.3851,2.1734;41.3861,2.1744\`).
4. Feu clic a **OK** per guardar.

> **Important**: Cal afegir almenys 2 punts perquè la línia es pugui dibuixar.

## Gestionar línies

### Des de la llista de línies (Arranjament → Línies)

- **Arrossegar** per reordenar.
- **Editar** (✏️) per modificar les dades.
- **Eliminar** (🗑️) per esborrar la línia.

### Des de la pàgina de Llegendes

1. Aneu a **Barra lateral** → **Llegendes de línies**.
2. Veureu totes les línies creades.
3. Podeu:
   - **Mostrar/Amagar** una línia individual (checkbox).
   - **Mostrar/Amagar totes** amb el commutador de la part superior.
   - **Editar línies** (botó "Editar línies").
   - **Centrar el mapa** en una línia fent clic a la targeta (s'ha de mostrar al mapa).

## Visibilitat de les línies

- El commutador **"Mostrar línies"** a la pàgina de Llegendes controla si totes les línies són visibles al mapa.
- Cada línia té la seva pròpia visibilitat individual (checkbox).
- Les línies es mostren per ordre invers (la més recent a sobre).

## Detall de la línia al mapa

Quan una línia és visible:
- Es dibuixa amb el color i el gruix especificats.
- Fent clic a la targeta de la línia a la pàgina de Llegendes, el mapa s'ajusta per mostrar-la completament.

# Obtenció d'URLs d'imatges

Per afegir una imatge a un pin, necessiteu una URL pública que apunti directament al fitxer d'imatge. Aquesta URL ha de ser accessible des de qualsevol dispositiu i acabar habitualment amb extensions com \`.jpg\`, \`.png\`, \`.webp\` o \`.gif\`.

### Com obtenir una URL d'imatge
Per obtenir els enllaços d'imatges és recomanable fer-ho des de un equip d'escriptori, però en dispositius mòbils també és possible.

Hi ha diverses maneres d'obtenir una URL d'imatge per als vostres pins:

**1. Imatges pròpies allotjades al núvol**

-   Pujau les vostres imatges a serveis com **Google Fotos**, **iCloud**, **Dropbox** o **OneDrive**.
-   Activeu l'opció de compartir i obteniu l'enllaç públic. Assegureu-vos que l'enllaç apunti directament a la imatge (no a la pàgina de visualització).
-   Per a Google Fotos, heu de crear un àlbum compartit i obtenir l'URL de cada imatge individual.

**2. Plataformes d'allotjament d'imatges**

-   Serveis com **Imgur**, **Postimages**, **TinyPic** o **ImageShack** us permeten pujar imatges gratuïtament i obtenir-ne una URL directa.
-   Pujau la imatge, copieu l'enllaç directe (normalment marcat com a "Direct Link" o "URL de la imatge") i enganxeu-lo al camp corresponent.

**3. Xarxes socials**

-   Podeu obtenir l'URL d'una imatge publicada a **Instagram**, **Facebook** o **Twitter**.
-   Obriu la imatge en una pestanya nova i copieu l'URL de la barra d'adreces. En alguns casos, haureu de buscar l'opció "Obrir imatge a una finestra nova".

**4. Cerca d'imatges**

-   Cerqueu la imatge que us interessa a **Google Imatges** o **Bing Images**.
-   Obriu la imatge a mida completa i copieu l'URL de la barra d'adreces. Assegureu-vos que la imatge no tingui drets d'autor si l'utilitzeu per a ús públic.

### Consells pràctics

-   **Eviteu URLs curtes** o escurçadores com [bit.ly](https://bit.ly/), ja que no sempre funcionen correctament.
-   **Comproveu que l'URL funciona** obrint-la en una pestanya incògnit del navegador. Si la imatge es carrega, l'URL és vàlida.
-   **Preferiu imatges quadrades** o amb una relació d'aspecte propera a 1:1 per a una millor visualització a les targetes dels pins.
-   La mida recomanada per a les imatges és d'entre 200x200 i 800x800 píxels per equilibrar qualitat i velocitat de càrrega.

### Ús de la funció "Reciclar imatge"
LibrePin inclou una funció que us permet reutilitzar imatges que ja heu utilitzat en altres pins. Així estalvieu temps i eviteu duplicar enllaços. La trobareu al diàleg de creació/edició del pin, fent clic a la icona de les imatges (🔄).

# Altres preguntes

## Generals

### Què és LibrePin?
LibrePin és una aplicació web per gestionar punts d'interès personalitzats en un mapa interactiu. Permet crear, organitzar i visualitzar pins amb informació detallada.

### És gratuït?
Sí, LibrePin és completament gratuït i de codi obert.

### Necessito instal·lar alguna cosa?
No, només necessites un navegador web modern. L'aplicació funciona directament des del navegador. Instal·lar-la com a PWA és totalment opcional i no retalla cap funció no fer-ho.

### Les meves dades són segures?
Les dades s'emmagatzemen localment al teu navegador (LocalStorage). Ningú més pot accedir-hi tret que comparteixis el fitxer d'exportació. Els desenvolupadors no tenen cap possibilitat de consultar les dades.

---

# Dades i Persistència

La gestió de les dades és un dels aspectes centrals de LibrePin. Entendre com es guarden, com es poden transferir i com es protegeixen us ajudarà a treure'n el màxim profit i a utilitzar l'aplicació amb tranquil·litat.

---

## On es guarden les meves dades?

Totes les dades que genereu a LibrePin (pins, grups, línies, preferits, marcatges ràpids, etc.) s'emmagatzemen **exclusivament al LocalStorage del vostre navegador**. Això vol dir que:

- Les dades **no es perden** en tancar la pestanya o el navegador.
- Les dades **no s'envien a cap servidor extern**. Ni nosaltres ni cap tercera part hi tenim accés.
- Les dades són **específiques del navegador i del dispositiu** on feu servir l'aplicació. Si obriu LibrePin des d'un altre navegador o dispositiu, veureu un mapa buit (llevat que importeu les dades).

> **Important**: El LocalStorage té una capacitat limitada (normalment entre 5 i 10 MB per domini). Si treballeu amb moltes imatges o pins, us recomanem fer còpies de seguretat periòdiques.

---

## Com faig una còpia de seguretat?

Fer còpies de seguretat és senzill i us permet recuperar les dades si canvieu de dispositiu, de navegador, o si voleu compartir el vostre mapa amb algú altre.

1. Accediu a **Arranjament** → **Perfil**.
2. Feu clic al botó **"Exportar dataset"**.
3. El navegador us descarregarà automàticament un fitxer amb extensió \`.json\` que conté totes les dades de l'aplicació.
4. Guardeu aquest fitxer en un lloc segur (ordinador, núvol, disc extern, etc.).

El fitxer JSON conté tota la informació: pins, grups, línies, preferits, serveis de transport, marcatges ràpids, configuració de l'aparença, idioma, i fins i tot les vostres dades de perfil.

---

## Com restauro una còpia de seguretat?

Si heu exportat prèviament les vostres dades, podeu restaurar-les en qualsevol moment:

1. Accediu a **Arranjament** → **Perfil**.
2. Feu clic al botó **"Importar dataset"**.
3. Seleccioneu el fitxer \`.json\` que teníeu guardat.
4. L'aplicació us mostrarà una previsualització de les dades (nom de perfil, nombre de pins, etc.).
5. Després d'una espera de 5 segons, podreu confirmar la importació.
6. Un cop importades, l'aplicació es recarregarà automàticament per aplicar els canvis. **En cas que no ho faci, tanqueu i torneu a obrir LibrePin manualment.**

> **Advertència**: La importació **sobreescriu totes les dades actuals**. Si teniu dades al dispositiu que no voleu perdre, assegureu-vos de fer una còpia de seguretat abans d'importar.

---

## Puc esborrar totes les dades?

Sí, si voleu començar de zero o alliberar espai al LocalStorage:

1. Accediu a **Arranjament** → **Perfil**.
2. Feu clic al botó **"Esborrar totes les dades"** (en vermell).
3. Confirmeu l'acció al diàleg de confirmació.

> **ATENCIÓ**: Aquesta acció **no es pot desfer**. Tots els pins, grups, línies, preferits i configuracions s'eliminaran permanentment. Assegureu-vos de tenir una còpia de seguretat abans de procedir.

---

## Com puc compartir les meves dades?

LibrePin us permet compartir el vostre mapa d'aquesta manera:

### Compartir el fitxer d'exportació
- Exporteu les dades com a JSON (vegeu "Com faig una còpia de seguretat?").
- Envieu el fitxer per correu electrònic, Drive, Telegram, etc.
- La persona receptora pot importar el fitxer des del seu LibrePin i veure el vostre mapa.

---

## Què passa si canvio de navegador o dispositiu?

Les dades no es sincronitzen automàticament entre dispositius. Per traslladar el vostre mapa a un altre navegador o dispositiu:

1. Exporteu les dades des del dispositiu original (Arranjament → Perfil → Exportar dataset).
2. Transferiu el fitxer \`.json\` al nou dispositiu (per correu, USB, núvol, etc.).
3. Obriu LibrePin al nou dispositiu i importeu el fitxer.

D'aquesta manera, el vostre mapa estarà disponible allà on aneu.

---

## Consells de seguretat

- **Feu còpies de seguretat periòdiques**, sobretot si afegiu molts pins o si hi dediqueu temps a organitzar-los.
- **Guardeu el fitxer JSON en un lloc segur**, ja que conté totes les vostres dades.
- **No compartiu el fitxer JSON amb persones desconegudes** si conté informació sensible.
- Si treballeu en un dispositiu compartit, recordeu esborrar les dades o tancar la sessió del navegador després d'usar LibrePin.

# Resolució de problemes

De tant en tant, poden sorgir petites incidències. No us preocupeu, la majoria tenen solució ràpida. Aquí us deixem les més habituals i com abordar-les:

## El mapa no es carrega

-   Comproveu la connexió a Internet. El mapa necessita accés a la xarxa per carregar les imatges i les dades cartogràfiques.
-   Recarregueu l'aplicació des de **Arranjament → Recarregar app**. Això refresca l'estat sense perdre cap dada.
-   Si persisteix, proveu de netejar la memòria cau del navegador (Ctrl+F5 o Cmd+Shift+R). De vegades, una recàrrega forçada soluciona problemes de caché.

## Els pins no es mostren

-   Verifiqueu el **mode de visualització** actiu. Si esteu en mode "El meu entorn", només es mostren els pins que no estan marcats com a "Fora de l'entorn". Si esteu en mode "No destorbar", només es mostren els preferits.
-   Comproveu que els pins no estiguin filtrats per cap altre criteri.
-   Si tot sembla correcte, recarregueu l'aplicació per refrescar l'estat.

## La ubicació GPS no funciona

-   Assegureu-vos que heu concedit permís de geolocalització al navegador. Normalment, el navegador us ho demana en obrir l'aplicació per primera vegada.
-   Proveu de seleccionar una ciutat manualment des de **Arranjament → Posició**. Això us permetrà situar el mapa encara que el GPS no estigui disponible.
-   Comproveu la senyal GPS del vostre dispositiu. Si sou en interiors o en zones amb poca cobertura, pot ser que el dispositiu trigui a obtenir la ubicació.

## L'aplicació va lenta

-   Desactiveu l'agrupació de pins a **Arranjament → Aparença → No agrupar els pins**. Això pot millorar el rendiment si teniu molts pins, però tingueu en compte que pot alentir el mapa si n'hi ha massa.
-   Reduïu el nombre de pins visibles canviant de mode de visualització o eliminant pins que ja no us siguin útils.
-   Tanqueu altres pestanyes o aplicacions que puguin estar consumint recursos del dispositiu.

## Els canvis no s'apliquen

-   Alguns ajustaments requereixen recarregar l'aplicació per aplicar-se completament: canvi d'idioma, canvi de color d'accent, o activació/desactivació de l'agrupació de pins. L'aplicació us ho notificarà i es recarregarà automàticament en aquests casos.
-   Si heu fet un canvi i no es reflecteix, proveu de recarregar manualment l'aplicació des de **Arranjament → Recarregar app**.

## He perdut les dades

-   Si teníeu una còpia de seguretat prèvia, podeu restaurar-la des de **Perfil → Importar dataset**.
-   Si no en teníeu, les dades s'han perdut permanentment, ja que s'emmagatzemen exclusivament al LocalStorage del vostre navegador i no es guarden en cap servidor extern.
-   Per a futures ocasions, us recomanem fer còpies de seguretat periòdiques des de **Perfil → Exportar dataset**.

## Heu detectat un error que no apareix aquí?

Si heu trobat un problema que no està cobert en aquesta llista, podeu obrir una incidència al repositori de GitHub de LibrePin. Descriviu el pas a pas per reproduir l'error i, si és possible, adjunteu una captura de pantalla. Així ens ajudaràs a millorar l'aplicació per a tothom.

# Instalación y Configuración Inicial

## Cómo instalar LibrePin

LibrePin es una aplicación web que no requiere ningún proceso de instalación tradicional. Puedes acceder a ella directamente desde tu navegador, como cualquier otra página web. No necesitas descargar apps de ninguna tienda ni conceder permisos especiales.

Sin embargo, **recomendamos instalarla como PWA** (aplicación web progresiva). Esto significa que la web se instalará en tu dispositivo como si fuera una aplicación nativa: aparecerá en la pantalla de inicio de tu teléfono, tableta u ordenador, con su propio icono, y se abrirá a pantalla completa, sin las barras del navegador, ofreciéndote una experiencia más inmersiva y rápida.

### Cómo instalarla como PWA

La mayoría de navegadores modernos incluyen una opción para instalar páginas web como aplicaciones. El procedimiento es sencillo y solo te llevará unos segundos:

1. **Abre LibrePin** en tu navegador preferido (Chrome, Edge, Safari, Firefox, etc.).
2. **Localiza la opción de instalación** en el menú del navegador:
   - En **Chrome** (Android/ordenador): toca los tres puntos verticales ⋮ en la parte superior derecha y selecciona **"Instalar la aplicación"** o **"Crear un acceso directo"**.
   - En **Safari** (iPhone/iPad): toca el icono de compartir (cuadrado con flecha) y selecciona **"Añadir a la pantalla de inicio"**.
   - En **Firefox** (Android): toca los tres puntos ⋮ y selecciona **"Añadir a la pantalla de inicio"**.
3. **Confirma la instalación** y, si el navegador te lo permite, puedes cambiar el nombre del acceso directo antes de guardarlo.
4. A partir de este momento, encontrarás el icono de **LibrePin** en la pantalla de inicio de tu dispositivo, junto con el resto de aplicaciones.

### Ventajas de instalarla como PWA

- **Acceso rápido**: el icono permanece siempre en la pantalla de inicio, como cualquier otra app.
- **Pantalla completa**: se ejecuta sin las barras del navegador, aprovechando al máximo el espacio.
- **Funciona sin conexión** (parcialmente): una vez cargada, puedes consultar el mapa y los pins que ya has visitado, incluso sin Internet (aunque el mapa necesita conexión para cargar las imágenes).
- **Actualizaciones automáticas**: siempre tendrás la última versión, sin necesidad de descargar nada manualmente.

### Instalación tradicional (sin PWA)

Si prefieres no instalarla como PWA, simplemente añade el enlace a los favoritos de tu navegador o ábrela directamente desde la barra de direcciones cada vez que quieras utilizarla. No necesitas ningún otro paso.

> **Nota**: La instalación como PWA es completamente opcional y no afecta al funcionamiento de la aplicación. Puedes utilizar LibrePin indistintamente desde el navegador o desde el acceso directo instalado, ya que los datos se comparten entre ambos.

Un pin es un punto de interés que puedes añadir al mapa. Cada pin puede contener:

| **Nombre** | Título del pin. | ✅ Sí |

| **Descripción** | Texto largo con información detallada. | ❌ No |
| **Etiquetas** | Palabras clave separadas por comas. | ❌ No |
| **Imagen** | URL de una imagen para el pin. (No se permite subir un archivo, hablamos de esto más adelante.) | ❌ No |
| **Coordenadas** | Latitud y longitud (se obtienen automáticamente si se crea desde el mapa, no lo rellenes a mano si no procede). | ✅ Sí |
| **Valoración** | De 1 a 5 estrellas. | ❌ No |
| **Reseña** | Título (máx 50 caracteres) y texto libre. | ❌ No |
| **Botones personalizados** | Enlaces con texto personalizado. | ❌ No |
| **Parada de transporte** | Marca el pin como parada de transporte público. | ❌ No |
| **Servicios** | Servicio de transporte que circula. | ❌ No |
| **Enlaces de horario** | URL para consultar horarios. | ❌ No |
| **MP3** | URL de un audio para reproducir. (Solo si es una parada) | ❌ No |
| **Pins relacionados** | Otros pins vinculados. | ❌ No |
| **Fuera del entorno** | Marca el pin como fuera del entorno por defecto. | ❌ No |

# Leyendas y Líneas

## ¿Qué son las líneas?

Las líneas te permiten dibujar rutas o trazados en el mapa. Son útiles para:
- Marcar un itinerario.
- Indicar una ruta de transporte como el metro o trenes de cercanías.
- Dibujar un polígono para marcar una zona.

## Crear una línea

1. Ve a **Configuración** → **Líneas**.
2. Haz clic en **"Añadir línea"**.
3. Rellena los datos:
   - **Nombre** (obligatorio).
   - **URL del icono (PNG)** (opcional).
   - **Color** (selector de color).
   - **Grosor (px)**: Entre 2 y 12 píxeles.
   - **Puntos**: Lista de coordenadas separadas por \`;\` (ej: \`41.3851,2.1734;41.3861,2.1744\`).
4. Haz clic en **OK** para guardar.

> **Importante**: Hay que añadir al menos 2 puntos para que la línea se pueda dibujar.

## Gestionar líneas

### Desde la lista de líneas (Configuración → Líneas)

- **Arrastrar** para reordenar.
- **Editar** (✏️) para modificar los datos.
- **Eliminar** (🗑️) para borrar la línea.

### Desde la página de Leyendas

1. Ve a **Barra lateral** → **Leyendas de líneas**.
2. Verás todas las líneas creadas.
3. Puedes:
   - **Mostrar/Ocultar** una línea individual (checkbox).
   - **Mostrar/Ocultar todas** con el conmutador de la parte superior.
   - **Editar líneas** (botón "Editar líneas").
   - **Centrar el mapa** en una línea haciendo clic en la tarjeta (debe mostrarse en el mapa).

## Visibilidad de las líneas

- El conmutador **"Mostrar líneas"** en la página de Leyendas controla si todas las líneas son visibles en el mapa.
- Cada línea tiene su propia visibilidad individual (checkbox).
- Las líneas se muestran en orden inverso (la más reciente encima).

## Detalle de la línea en el mapa

Cuando una línea es visible:
- Se dibuja con el color y el grosor especificados.
- Al hacer clic en la tarjeta de la línea en la página de Leyendas, el mapa se ajusta para mostrarla completamente.

# Obtención de URLs de imágenes

Para añadir una imagen a un pin, necesitas una URL pública que apunte directamente al archivo de imagen. Esta URL debe ser accesible desde cualquier dispositivo y terminar habitualmente con extensiones como \`.jpg\`, \`.png\`, \`.webp\` o \`.gif\`.

### Cómo obtener una URL de imagen
Para obtener los enlaces de imágenes es recomendable hacerlo desde un equipo de escritorio, pero en dispositivos móviles también es posible.

Hay varias maneras de obtener una URL de imagen para tus pins:

**1. Imágenes propias alojadas en la nube**

-   Sube tus imágenes a servicios como **Google Fotos**, **iCloud**, **Dropbox** o **OneDrive**.
-   Activa la opción de compartir y obtén el enlace público. Asegúrate de que el enlace apunte directamente a la imagen (no a la página de visualización).
-   Para Google Fotos, debes crear un álbum compartido y obtener la URL de cada imagen individual.

**2. Plataformas de alojamiento de imágenes**

-   Servicios como **Imgur**, **Postimages**, **TinyPic** o **ImageShack** te permiten subir imágenes gratuitamente y obtener una URL directa.
-   Sube la imagen, copia el enlace directo (normalmente marcado como "Direct Link" o "URL de la imagen") y pégalo en el campo correspondiente.

**3. Redes sociales**

-   Puedes obtener la URL de una imagen publicada en **Instagram**, **Facebook** o **Twitter**.
-   Abre la imagen en una pestaña nueva y copia la URL de la barra de direcciones. En algunos casos, tendrás que buscar la opción "Abrir imagen en una ventana nueva".

**4. Búsqueda de imágenes**

-   Busca la imagen que te interesa en **Google Imágenes** o **Bing Images**.
-   Abre la imagen a tamaño completo y copia la URL de la barra de direcciones. Asegúrate de que la imagen no tenga derechos de autor si la usas para uso público.

### Consejos prácticos

-   **Evita URLs cortas** o acortadores como [bit.ly](https://bit.ly/), ya que no siempre funcionan correctamente.
-   **Comprueba que la URL funciona** abriéndola en una pestaña de incógnito del navegador. Si la imagen se carga, la URL es válida.
-   **Prefiere imágenes cuadradas** o con una relación de aspecto cercana a 1:1 para una mejor visualización en las tarjetas de los pins.
-   El tamaño recomendado para las imágenes es de entre 200x200 y 800x800 píxeles para equilibrar calidad y velocidad de carga.

### Uso de la función "Reciclar imagen"
LibrePin incluye una función que te permite reutilizar imágenes que ya has utilizado en otros pins. Así ahorras tiempo y evitas duplicar enlaces. La encontrarás en el diálogo de creación/edición del pin, haciendo clic en el icono de las imágenes (🔄).

# Otras preguntas

## Generales

### ¿Qué es LibrePin?
LibrePin es una aplicación web para gestionar puntos de interés personalizados en un mapa interactivo. Permite crear, organizar y visualizar pins con información detallada.

### ¿Es gratuito?
Sí, LibrePin es completamente gratuito y de código abierto.

### ¿Necesito instalar algo?
No, solo necesitas un navegador web moderno. La aplicación funciona directamente desde el navegador. Instalarla como PWA es totalmente opcional y no recorta ninguna función no hacerlo.

### ¿Mis datos son seguros?
Los datos se almacenan localmente en tu navegador (LocalStorage). Nadie más puede acceder a ellos a menos que compartas el archivo de exportación. Los desarrolladores no tienen ninguna posibilidad de consultar los datos.

# Datos y Persistencia

La gestión de los datos es uno de los aspectos centrales de LibrePin. Entender cómo se guardan, cómo se pueden transferir y cómo se protegen te ayudará a sacar el máximo provecho y a utilizar la aplicación con tranquilidad.

## ¿Dónde se guardan mis datos?

Todos los datos que generes en LibrePin (pins, grupos, líneas, favoritos, marcajes rápidos, etc.) se almacenan **exclusivamente en el LocalStorage de tu navegador**. Esto significa que:

- Los datos **no se pierden** al cerrar la pestaña o el navegador.
- Los datos **no se envían a ningún servidor externo**. Ni nosotros ni ningún tercero tenemos acceso a ellos.
- Los datos son **específicos del navegador y del dispositivo** donde usas la aplicación. Si abres LibrePin desde otro navegador o dispositivo, verás un mapa vacío (a menos que importes los datos).

> **Importante**: El LocalStorage tiene una capacidad limitada (normalmente entre 5 y 10 MB por dominio). Si trabajas con muchas imágenes o pins, te recomendamos hacer copias de seguridad periódicas.

## ¿Cómo hago una copia de seguridad?

Hacer copias de seguridad es sencillo y te permite recuperar los datos si cambias de dispositivo, de navegador, o si quieres compartir tu mapa con alguien más.

1. Accede a **Configuración** → **Perfil**.
2. Haz clic en el botón **"Exportar dataset"**.
3. El navegador te descargará automáticamente un archivo con extensión \`.json\` que contiene todos los datos de la aplicación.
4. Guarda este archivo en un lugar seguro (ordenador, nube, disco externo, etc.).

El archivo JSON contiene toda la información: pins, grupos, líneas, favoritos, servicios de transporte, marcajes rápidos, configuración de la apariencia, idioma, e incluso tus datos de perfil.

## ¿Cómo restauro una copia de seguridad?

Si has exportado previamente tus datos, puedes restaurarlos en cualquier momento:

1. Accede a **Configuración** → **Perfil**.
2. Haz clic en el botón **"Importar dataset"**.
3. Selecciona el archivo \`.json\` que tenías guardado.
4. La aplicación te mostrará una previsualización de los datos (nombre de perfil, número de pins, etc.).
5. Después de una espera de 5 segundos, podrás confirmar la importación.
6. Una vez importados, la aplicación se recargará automáticamente para aplicar los cambios. **En caso de que no lo haga, cierra y vuelve a abrir LibrePin manualmente.**

> **Advertencia**: La importación **sobrescribe todos los datos actuales**. Si tienes datos en el dispositivo que no quieres perder, asegúrate de hacer una copia de seguridad antes de importar.

## ¿Puedo borrar todos los datos?

Sí, si quieres empezar de cero o liberar espacio en el LocalStorage:

1. Accede a **Configuración** → **Perfil**.
2. Haz clic en el botón **"Borrar todos los datos"** (en rojo).
3. Confirma la acción en el diálogo de confirmación.

> **ATENCIÓN**: Esta acción **no se puede deshacer**. Todos los pins, grupos, líneas, favoritos y configuraciones se eliminarán permanentemente. Asegúrate de tener una copia de seguridad antes de proceder.

## ¿Cómo puedo compartir mis datos?

LibrePin te permite compartir tu mapa de esta manera:

### Compartir el archivo de exportación
- Exporta los datos como JSON (ver "¿Cómo hago una copia de seguridad?").
- Envía el archivo por correo electrónico, Drive, Telegram, etc.
- La persona receptora puede importar el archivo desde su LibrePin y ver tu mapa.

## ¿Qué pasa si cambio de navegador o dispositivo?

Los datos no se sincronizan automáticamente entre dispositivos. Para trasladar tu mapa a otro navegador o dispositivo:

1. Exporta los datos desde el dispositivo original (Configuración → Perfil → Exportar dataset).
2. Transfiere el archivo \`.json\` al nuevo dispositivo (por correo, USB, nube, etc.).
3. Abre LibrePin en el nuevo dispositivo e importa el archivo.

De esta manera, tu mapa estará disponible donde vayas.

## Consejos de seguridad

- **Haz copias de seguridad periódicas**, sobre todo si añades muchos pins o si dedicas tiempo a organizarlos.
- **Guarda el archivo JSON en un lugar seguro**, ya que contiene todos tus datos.
- **No compartas el archivo JSON con personas desconocidas** si contiene información sensible.
- Si trabajas en un dispositivo compartido, recuerda borrar los datos o cerrar la sesión del navegador después de usar LibrePin.

# Resolución de problemas

De vez en cuando, pueden surgir pequeñas incidencias. No te preocupes, la mayoría tienen solución rápida. Aquí te dejamos las más habituales y cómo abordarlas:

## El mapa no se carga

-   Comprueba la conexión a Internet. El mapa necesita acceso a la red para cargar las imágenes y los datos cartográficos.
-   Recarga la aplicación desde **Configuración → Recargar app**. Esto refresca el estado sin perder ningún dato.
-   Si persiste, prueba a limpiar la memoria caché del navegador (Ctrl+F5 o Cmd+Shift+R). A veces, una recarga forzada soluciona problemas de caché.

## Los pins no se muestran

-   Verifica el **modo de visualización** activo. Si estás en modo "Mi entorno", solo se muestran los pins que no están marcados como "Fuera del entorno". Si estás en modo "No molestar", solo se muestran los favoritos.
-   Comprueba que los pins no estén filtrados por ningún otro criterio.
-   Si todo parece correcto, recarga la aplicación para refrescar el estado.

## La ubicación GPS no funciona

-   Asegúrate de que has concedido permiso de geolocalización al navegador. Normalmente, el navegador te lo pide al abrir la aplicación por primera vez.
-   Prueba a seleccionar una ciudad manualmente desde **Configuración → Posición**. Esto te permitirá situar el mapa aunque el GPS no esté disponible.
-   Comprueba la señal GPS de tu dispositivo. Si estás en interiores o en zonas con poca cobertura, puede que el dispositivo tarde en obtener la ubicación.

## La aplicación va lenta

-   Desactiva la agrupación de pins en **Configuración → Apariencia → No agrupar los pins**. Esto puede mejorar el rendimiento si tienes muchos pins, pero ten en cuenta que puede ralentizar el mapa si hay demasiados.
-   Reduce el número de pins visibles cambiando de modo de visualización o eliminando pins que ya no te sean útiles.
-   Cierra otras pestañas o aplicaciones que puedan estar consumiendo recursos del dispositivo.

## Los cambios no se aplican

-   Algunos ajustes requieren recargar la aplicación para aplicarse completamente: cambio de idioma, cambio de color de acento, o activación/desactivación de la agrupación de pins. La aplicación te lo notificará y se recargará automáticamente en estos casos.
-   Si has hecho un cambio y no se refleja, prueba a recargar manualmente la aplicación desde **Configuración → Recargar app**.

## He perdido los datos

-   Si tenías una copia de seguridad previa, puedes restaurarla desde **Perfil → Importar dataset**.
-   Si no tenías, los datos se han perdido permanentemente, ya que se almacenan exclusivamente en el LocalStorage de tu navegador y no se guardan en ningún servidor externo.
-   Para futuras ocasiones, te recomendamos hacer copias de seguridad periódicas desde **Perfil → Exportar dataset**.

## ¿Has detectado un error que no aparece aquí?

Si has encontrado un problema que no está cubierto en esta lista, puedes abrir una incidencia en el repositorio de GitHub de LibrePin. Describe el paso a paso para reproducir el error y, si es posible, adjunta una captura de pantalla. Así nos ayudarás a mejorar la aplicación para todos.

# Installation and Initial Setup

## How to install LibrePin

LibrePin is a web application that does not require any traditional installation process. You can access it directly from your browser, like any other web page. You don't need to download apps from any store or grant special permissions.

However, **we recommend installing it as a PWA** (progressive web application). This means that the web will install on your device as if it were a native application: it will appear on the home screen of your phone, tablet, or computer, with its own icon, and it will open in full screen, without browser bars, offering you a more immersive and faster experience.

### How to install it as a PWA

Most modern browsers include an option to install web pages as applications. The procedure is simple and will only take a few seconds:

1. **Open LibrePin** in your preferred browser (Chrome, Edge, Safari, Firefox, etc.).
2. **Locate the installation option** in the browser menu:
   - In **Chrome** (Android/computer): tap the three vertical dots ⋮ in the top right corner and select **"Install app"** or **"Create shortcut"**.
   - In **Safari** (iPhone/iPad): tap the share icon (square with arrow) and select **"Add to Home Screen"**.
   - In **Firefox** (Android): tap the three dots ⋮ and select **"Add to Home Screen"**.
3. **Confirm the installation** and, if the browser allows it, you can change the name of the shortcut before saving it.
4. From this moment on, you will find the **LibrePin** icon on your device's home screen, along with the rest of your applications.

### Advantages of installing as a PWA

- **Quick access**: the icon remains on the home screen, like any other app.
- **Full screen**: it runs without browser bars, making the most of the space.
- **Works offline** (partially): once loaded, you can consult the map and the pins you have already visited, even without Internet (although the map needs a connection to load images).
- **Automatic updates**: you will always have the latest version, without having to download anything manually.

### Traditional installation (without PWA)

If you prefer not to install it as a PWA, simply add the link to your browser's bookmarks or open it directly from the address bar every time you want to use it. No other steps are required.

> **Note**: Installing as a PWA is completely optional and does not affect the functioning of the application. You can use LibrePin interchangeably from the browser or from the installed shortcut, as data is shared between both.

# View Modes

LibrePin has four view modes that allow you to filter the pins shown on the map and in the lists.

## Access to modes

You can change mode in two ways:
1. **Sidebar**: "View mode" option.
2. **Search bar**: From the search, clicking the 👁️ icon.

## Available modes

### 1. My environment (🏠)

- **Description**: Shows only pins from your environment.
- **How it works**: Filters pins that have the "Outside my environment" mark disabled.
- **Indicator**: Green dot on the profile icon.

### 2. Outside my environment (🌴)

- **Description**: Shows all pins, including those outside your environment.
- **How it works**: Does not apply any environment filter.
- **Indicator**: Orange dot on the profile icon.

### 3. Do not disturb (🌙)

- **Description**: Shows only pins marked as favorites.
- **How it works**: Filters pins that are not favorites.
- **Indicator**: Red dot on the profile icon.

### 4. Transport only (🚌)

- **Description**: Shows only public transport stops.
- **How it works**: Filters pins that do not have the "Is a public transport stop" mark activated.
- **Indicator**: Blue dot on the profile icon.

## Effects of mode on other functions

- **Search**: Only results from pins visible in the current mode are shown.
- **Groups**: Only visible pins are shown within groups.
- **Recent**: Only visible pins are shown.
- **Favorites**: In "Do not disturb" mode, only favorites are shown (they already are by definition).

# Getting Image URLs

To add an image to a pin, you need a public URL that points directly to the image file. This URL must be accessible from any device and usually end with extensions like \`.jpg\`, \`.png\`, \`.webp\`, or \`.gif\`.

### How to get an image URL
Getting image links is recommended from a desktop computer, but it is also possible on mobile devices.

There are several ways to get an image URL for your pins:

**1. Own images hosted in the cloud**

-   Upload your images to services like **Google Photos**, **iCloud**, **Dropbox**, or **OneDrive**.
-   Activate the sharing option and get the public link. Make sure the link points directly to the image (not to the viewing page).
-   For Google Photos, you need to create a shared album and get the URL of each individual image.

**2. Image hosting platforms**

-   Services like **Imgur**, **Postimages**, **TinyPic**, or **ImageShack** allow you to upload images for free and get a direct URL.
-   Upload the image, copy the direct link (usually marked as "Direct Link" or "Image URL") and paste it into the corresponding field.

**3. Social networks**

-   You can get the URL of an image published on **Instagram**, **Facebook**, or **Twitter**.
-   Open the image in a new tab and copy the URL from the address bar. In some cases, you will need to look for the "Open image in new window" option.

**4. Image search**

-   Search for the image you are interested in on **Google Images** or **Bing Images**.
-   Open the image at full size and copy the URL from the address bar. Make sure the image does not have copyright if you use it for public use.

### Practical tips

-   **Avoid short URLs** or link shorteners like [bit.ly](https://bit.ly/), as they don't always work correctly.
-   **Check that the URL works** by opening it in an incognito browser tab. If the image loads, the URL is valid.
-   **Prefer square images** or with an aspect ratio close to 1:1 for better display on pin cards.
-   The recommended size for images is between 200x200 and 800x800 pixels to balance quality and loading speed.

### Using the "Recycle image" function
LibrePin includes a function that allows you to reuse images that you have already used in other pins. This saves time and avoids duplicating links. You will find it in the pin creation/editing dialog, clicking on the images icon (🔄).

# Other Questions

## General

### What is LibrePin?
LibrePin is a web application for managing personalized points of interest on an interactive map. It allows you to create, organize, and visualize pins with detailed information.

### Is it free?
Yes, LibrePin is completely free and open source.

### Do I need to install anything?
No, you only need a modern web browser. The application works directly from the browser. Installing it as a PWA is totally optional and does not cut any functionality if you don't.

### Are my data safe?
Data is stored locally in your browser (LocalStorage). No one else can access it unless you share the export file. The developers have no way of consulting the data.

# Data and Persistence

Data management is one of the central aspects of LibrePin. Understanding how data is saved, transferred, and protected will help you get the most out of it and use the application with peace of mind.

## Where are my data stored?

All data you generate in LibrePin (pins, groups, lines, favorites, quick marks, etc.) are stored **exclusively in your browser's LocalStorage**. This means that:

- Data is **not lost** when you close the tab or browser.
- Data is **not sent to any external server**. Neither we nor any third party have access to it.
- Data is **specific to the browser and device** where you use the application. If you open LibrePin from another browser or device, you will see an empty map (unless you import the data).

> **Important**: LocalStorage has a limited capacity (usually between 5 and 10 MB per domain). If you work with many images or pins, we recommend making periodic backups.

## How do I make a backup?

Making backups is simple and allows you to recover data if you change devices, browsers, or if you want to share your map with someone else.

1. Go to **Settings** → **Profile**.
2. Click the **"Export dataset"** button.
3. The browser will automatically download a file with the \`.json\` extension containing all the application data.
4. Save this file in a safe place (computer, cloud, external disk, etc.).

The JSON file contains all the information: pins, groups, lines, favorites, transport services, quick marks, appearance configuration, language, and even your profile data.

## How do I restore a backup?

If you have previously exported your data, you can restore them at any time:

1. Go to **Settings** → **Profile**.
2. Click the **"Import dataset"** button.
3. Select the \`.json\` file you had saved.
4. The application will show you a preview of the data (profile name, number of pins, etc.).
5. After a 5-second wait, you will be able to confirm the import.
6. Once imported, the application will reload automatically to apply the changes. **If it doesn't, close and reopen LibrePin manually.**

> **Warning**: Importing **overwrites all current data**. If you have data on the device that you don't want to lose, make sure to back up before importing.

## Can I delete all data?

Yes, if you want to start from scratch or free up space in LocalStorage:

1. Go to **Settings** → **Profile**.
2. Click the **"Delete all data"** button (in red).
3. Confirm the action in the confirmation dialog.

> **WARNING**: This action **cannot be undone**. All pins, groups, lines, favorites, and configurations will be permanently deleted. Make sure you have a backup before proceeding.

## How can I share my data?

LibrePin allows you to share your map in this way:

### Share the export file
- Export the data as JSON (see "How do I make a backup?").
- Send the file by email, Drive, Telegram, etc.
- The recipient can import the file from their LibrePin and view your map.

## What happens if I change browser or device?

Data does not synchronize automatically between devices. To transfer your map to another browser or device:

1. Export the data from the original device (Settings → Profile → Export dataset).
2. Transfer the \`.json\` file to the new device (by email, USB, cloud, etc.).
3. Open LibrePin on the new device and import the file.

This way, your map will be available wherever you go.

## Security tips

- **Make periodic backups**, especially if you add many pins or spend time organizing them.
- **Save the JSON file in a safe place**, as it contains all your data.
- **Do not share the JSON file with strangers** if it contains sensitive information.
- If you work on a shared device, remember to delete the data or close the browser session after using LibrePin.

# Troubleshooting

From time to time, small issues may arise. Don't worry, most have a quick solution. Here are the most common ones and how to address them:

## The map does not load

-   Check your Internet connection. The map needs network access to load images and cartographic data.
-   Reload the application from **Settings → Reload app**. This refreshes the state without losing any data.
-   If it persists, try clearing the browser cache (Ctrl+F5 or Cmd+Shift+R). Sometimes a hard reload solves caching problems.

## Pins do not show

-   Verify the active **view mode**. If you are in "My environment" mode, only pins that are not marked as "Outside environment" are shown. If you are in "Do not disturb" mode, only favorites are shown.
-   Check that pins are not filtered by any other criteria.
-   If everything seems correct, reload the application to refresh the state.

## GPS location does not work

-   Make sure you have granted geolocation permission to the browser. Usually, the browser asks you when opening the application for the first time.
-   Try selecting a city manually from **Settings → Position**. This will allow you to position the map even if GPS is not available.
-   Check the GPS signal on your device. If you are indoors or in areas with poor coverage, the device may take time to get the location.

## The application is slow

-   Disable pin clustering at **Settings → Appearance → Do not cluster pins**. This can improve performance if you have many pins, but keep in mind that it can slow down the map if there are too many.
-   Reduce the number of visible pins by changing the view mode or deleting pins that are no longer useful.
-   Close other tabs or applications that may be consuming device resources.

## Changes do not apply

-   Some settings require reloading the application to apply completely: language change, accent color change, or activation/deactivation of pin clustering. The application will notify you and reload automatically in these cases.
-   If you have made a change and it does not reflect, try manually reloading the application from **Settings → Reload app**.

## I have lost data

-   If you had a previous backup, you can restore it from **Profile → Import dataset**.
-   If you didn't, the data has been permanently lost, as it is stored exclusively in your browser's LocalStorage and is not saved on any external server.
-   For future occasions, we recommend making periodic backups from **Profile → Export dataset**.

## Have you detected an error not listed here?

If you have found a problem that is not covered in this list, you can open an issue in the LibrePin GitHub repository. Describe the step-by-step process to reproduce the error and, if possible, attach a screenshot. This will help us improve the application for everyone.

        function extractSections(md) {
            const lines = md.split('\n');
            const sections = [];
            let current = null;
            let buffer = [];

            for (const line of lines) {
                if (line.startsWith('# ')) {
                    if (current) {
                        sections.push({ title: current, content: buffer.join('\n').trim() });
                    }
                    current = line.replace('# ', '').trim();
                    buffer = [];
                } else {
                    buffer.push(line);
                }
            }
            if (current && buffer.length > 0) {
                sections.push({ title: current, content: buffer.join('\n').trim() });
            }
            return sections;
        }

        function renderDoc(lang) {
            let md = '';
            if (lang === 'ca') md = MD_CA;
            else if (lang === 'es') md = MD_ES;
            else if (lang === 'en') md = MD_EN;
            else md = MD_CA;

            const sections = extractSections(md);
            renderSidebar(sections, lang);

            if (sections.length > 0) {
                const firstSection = sections[0];
                state.currentSection = firstSection.title;
                renderContent(firstSection.title, firstSection.content);
            } else {
                document.getElementById('mdContent').innerHTML = '<p>No s\'ha trobat contingut.</p>';
            }
        }

        function renderSidebar(sections, lang) {
            const container = document.getElementById('sidebarNav');
            const titles = { ca: 'Seccions', es: 'Secciones', en: 'Sections' };

            let html = `<div class="nav-section">${titles[lang] || 'Seccions'}</div>`;
            sections.forEach((sec, index) => {
                const active = sec.title === state.currentSection ? 'active' : '';
                const icon = index === 0 ? 'fa-home' : 'fa-file-lines';
                html += `<button class="nav-item ${active}" data-section="${sec.title}" data-index="${index}"><i class="fas ${icon}"></i> ${sec.title}</button>`;
            });
            container.innerHTML = html;

            container.querySelectorAll('.nav-item').forEach(btn => {
                btn.onclick = () => {
                    const title = btn.dataset.section;
                    const idx = parseInt(btn.dataset.index);
                    if (idx >= 0 && idx < sections.length) {
                        state.currentSection = title;
                        renderContent(title, sections[idx].content);
                        document.querySelectorAll('.sidebar .nav-item').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        closeSidebar();
                        scrollToTop();
                    }
                };
            });

                    const text = el.textContent.toLowerCase();
                    el.style.display = text.includes(term) ? 'flex' : 'none';

            container.innerHTML = marked.parse(`# ${title}\n\n${content}`);

            const docContent = document.getElementById('docContent');
            const mdContent = document.getElementById('mdContent');
            const page = document.getElementById('docsPage');
            if (docContent) docContent.scrollTop = 0;
            if (mdContent) mdContent.scrollTop = 0;
            if (page) page.scrollTop = 0;
        }

        function toggleSidebar() {
            const overlay = document.getElementById('sidebarOverlay');
            overlay.classList.toggle('active');
            document.body.style.overflow = overlay.classList.contains('active') ? 'hidden' : '';
        }

        function closeSidebar() {
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
            document.getElementById('themeToggle').innerHTML = state.darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('librepin_docs_theme', state.darkMode ? 'dark' : 'light');
        }

        function loadTheme() {
            const saved = localStorage.getItem('librepin_docs_theme');
            if (saved === 'dark') {
                state.darkMode = true;
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
            }
        }

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.languages?.[0] || 'ca';
            const short = lang.slice(0, 2).toLowerCase();
            return ['ca', 'es', 'en'].includes(short) ? short : 'ca';
        }

        function init() {
            loadTheme();

            const browserLang = getBrowserLanguage();
            state.lang = browserLang;
            document.getElementById('langSelect').value = browserLang;
            localStorage.setItem('librepin_docs_lang', browserLang);

            renderDoc(state.lang);

                if (e.key === 'f' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    document.getElementById('sidebarSearch').focus();
                }
            });

            setTimeout(scrollToTop, 150);
            console.log('LibrePin Docs v' + APP_VERSION + ' loaded!');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
